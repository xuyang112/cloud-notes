name: Supabase keep-alive

on:
  workflow_dispatch:
  schedule:
    # UTC 04:17 on day 1, 4, 7, ... of each month (at most 3 days apart).
    - cron: '17 4 */3 * *'

permissions: {}

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Missing SUPABASE_ANON_KEY secret"; exit 1; }
          [[ "$SUPABASE_URL" == https://* ]] || { echo "::error::SUPABASE_URL must use HTTPS"; exit 1; }
      - name: Read one published note
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/notes?select=id&published=eq.true&limit=1" \
            --output response.json
          jq -e 'type == "array"' response.json >/dev/null
          echo "Database read completed successfully."
